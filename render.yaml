# DB-free validation service. Supabase keys are intentionally omitted.
services:
  - type: web
    name: my-ops-personal-preview
    runtime: node
    plan: free
    autoDeploy: false
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm build
    startCommand: node scripts/render-start.mjs
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
